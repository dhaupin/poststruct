# Freestruct post-render SEO layer for the baked docs.
# Runs AFTER `jekyll build`; output dir docs/_site is discovered from here.
# Canonical math: site.url + basePath + RelSlug => https://docs.creadev.org/poststruct/<page>
site:
  name: poststruct docs
  url: https://docs.creadev.org
  description: Audit what shipped - the check catalog, pack system, and usage for the poststruct auditor.
basePath: /poststruct
# Twitter spots intentionally left for the fleet house defaults:
# twitter: { username: "@..." }

# Open Graph - rendered by web/scripts/build-og.mjs (Liberation Sans via
# resvg), committed as docs/og-image.png alongside the product site card.
og:
  image: /og-image.png
  type: website
  locale: en_US

# Author identity: ships as a schema.org Person under "founder" on the
# injected Organization JSON-LD block - the same ownership shape the
# product site carries (issue gistory#13).
author:
  name: Creadev.org
  url: https://creadev.org

# Maintainer identity: custom JSON-LD appended after the built-in
# Organization + WebSite blocks (missing-only gate keeps pages that arrive
# with their own ld+json untouched).
jsonLd:
  - "@type": Person
    name: dhaupin
    url: https://github.com/dhaupin
    jobTitle: poststruct maintainer

# The baked output tree (discovered by freestruct from docs/).
# Auto BreadcrumbList per page: a trail from the URL tree (site root -> path
# segments -> the page title). The home page ships none. Carried since
# freestruct 1.1.0, so every pinned version in the family has it.
breadcrumb: true

outputDir: _site

# linkCheck is ON (freestruct#32 shipped in the pinned 1.2.0): the strict link
# checker now resolves root-absolute hrefs (`/poststruct/...`) against the
# artifact root WITH basePath awareness, so the baseurl'd nav no longer
# false-fails --strict. The 1.1.0 pin was the only reason this was suspended.
# The rest of the strict gate stays on too (canonical/sitemap, og, noindex,
# dangerous tags), and the docs-gates step still link-checks the markdown
# sources.
