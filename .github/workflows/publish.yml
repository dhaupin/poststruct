name: publish
# The repo-cut release ladder (eyestruct's proven shape, adopted for
# poststruct - eyestruct@4e2b552 .github/workflows/publish.yml): a tag drives
# the whole ladder end-to-end, and nothing is earned by a green publish step
# alone. The gap eyestruct's 1.0.0 cut proved: publish CAN go green while the
# registry result is wrong, because nothing asserted the tarball between
# proof-of-publish and proof-of-work.
#
#   1. publish  - npm trusted publishing (OIDC): NO NPM_TOKEN secret exists
#                 (the family law). The job's id-token proves the tarball
#                 came from THIS tree; npm >= 11.5.1 floor installed
#                 in-lane. The battery rides automatically: npm publish
#                 runs prepublishOnly (npm run check = test + lint:packs +
#                 conform:packs + lint:docs) - a red battery cannot mint a
#                 tarball. Gate: 0.x refused (the family release ladder: 0.x
#                 is the manual ship lane), and on a tag push the tag must
#                 equal the packaged version.
#   2. release  - the GH release object is cut from the pushed tag. Its
#                 notes are EXTRACTED from the changelog's own [version]
#                 section (scripts/release-notes.cjs) - a release body that
#                 disagrees with the changelog is drift, and an empty
#                 extraction refuses the cut. Idempotent. The served tarball
#                 is attached as the release asset (npm pack
#                 poststruct@<version>) so the GH release and the npm
#                 artifact are the same bytes.
#   3. verify   - the post-publish truth (scripts/verify-release.cjs):
#                 --npm registry latest == this tree's version, the served
#                 tarball's sha512 == the registry integrity metadata,
#                 provenance present, then the full pack ladder on the
#                 served tarball; --gh the release object exists, targets
#                 the tag's commit, its source tarball diffs clean against
#                 `git archive` of that commit, and its attached asset's
#                 sha512 equals the registry integrity.
#
# poststruct ships `packs/` in the tarball by design (package.json files
# carries `packs/`; the family verdict packs ride the published tarball,
# poststruct#79), so the pack ladder is invoked with `--allow packs/` - the
# default forbidden scan would otherwise refuse every pack file by prefix.
#
# The pack ladder also runs OFFLINE in the battery on every push
# (test/release-verify.test.cjs), so the contents assertions have a standing
# CI receipt instead of living only on release days.
#
# DORMANT until the first manual publish: OIDC cannot create a brand-new
# package (npm/cli#8544), so claim poststruct once from a dev machine
# (DEPLOY.md, "0.9.x is manual"):
#
#   1. npm run check                       # the gate
#   2. npm publish                         # one-time manual bootstrap
#   3. npmjs.com -> poststruct -> Settings -> Trusted Publisher:
#      repo dhaupin/poststruct, workflow publish.yml
#   4. from then on: npm version minor|major && git push --follow-tags
#
# verify-only dispatch mode: no publish, no release minting - the verify job
# re-runs the trust ladder against what is ALREADY published and released.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      mode:
        description: 'publish = registry cut | verify-only = re-run the trust ladder against what is already served'
        required: false
        default: 'publish'
        type: choice
        options: ['publish', 'verify-only']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    if: github.event_name == 'push' || inputs.mode != 'verify-only'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.gate.outputs.version }}
      tag: ${{ steps.gate.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - name: npm floor for trusted publishing (11.5.1+)
        run: npm install -g npm@^11
      - id: gate
        name: the gate - 0.x refused, tag == packaged version
        # Every github context value reaches this script through env, never
        # inline interpolation - an expression-injected tag name is the
        # classic Actions injection class, and ref_name is
        # attacker-adjacent input however much we trust the collaborators.
        env:
          TAG_REF: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -e
          V="$(node -p "require('./package.json').version")"
          case "$V" in
            0.*) echo "publish gate: refusing $V - the OIDC lane serves 1.0.0+ only (the family release ladder: 0.x is the manual ship lane)"; exit 1 ;;
          esac
          REF="$TAG_REF"
          EVENT="$EVENT_NAME"
          if [ "$EVENT" = "push" ]; then
            if [ "$REF" != "v$V" ]; then
              echo "publish gate: refusing - tag $REF does not equal the packaged version v$V (a tag that lies about its version never cuts)"; exit 1
            fi
          fi
          TAG="v$V"
          echo "publish gate: $TAG passes the 0.x refusal and the tag==version gate"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - run: npm ci --no-fund --no-audit
      # Idempotent: if the registry already has this exact version -- e.g. the
      # release was re-fired after fixing a later workflow -- skip the publish
      # instead of failing red on "cannot publish over the previously published
      # version". Version drift between package.json and the registry still
      # publishes normally.
      - name: Publish (skip if the registry already has this version)
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          REMOTE=$(npm view poststruct@$LOCAL version 2>/dev/null || true)
          if [ "$REMOTE" = "$LOCAL" ]; then
            echo "poststruct@$LOCAL already on the registry -- skipping publish"
          else
            npm publish --provenance
          fi

  release:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      # BLOCK_VERSION/TAG arrive through env from the publish job's outputs
      # - the same no-inline-interpolation rule the gate obeys. notes.md
      # lives in RUNNER_TEMP: never a silent overwrite of a repo file that
      # happens to carry the name.
      - name: extract the release notes from the changelog (refuses empty)
        env:
          BLOCK_VERSION: ${{ needs.publish.outputs.version }}
        run: node scripts/release-notes.cjs "$BLOCK_VERSION" > "$RUNNER_TEMP/notes.md"
      - name: cut the GH release from the tag (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
          BLOCK_VERSION: ${{ needs.publish.outputs.version }}
          BLOCK_TAG: ${{ needs.publish.outputs.tag }}
        run: |
          TAG="$BLOCK_TAG"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "release $TAG already exists - not re-minting; the verify job judges its truth"
          else
            gh release create "$TAG" --title "poststruct $BLOCK_VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          fi
      - name: attach the served tarball to the release
        env:
          GH_TOKEN: ${{ github.token }}
          BLOCK_VERSION: ${{ needs.publish.outputs.version }}
          BLOCK_TAG: ${{ needs.publish.outputs.tag }}
        run: |
          set -e
          # The EXACT tarball the registry serves for this version - the
          # artifact npm received, not a re-pack of the checkout, so the
          # release asset and the npm artifact can never drift.
          # The registry read replica can lag the publish by seconds; poll
          # (bounded) instead of racing it (the crashtest 1.2.0 cut read
          # ETARGET: no matching version right after publish).
          for i in $(seq 1 60); do
            if npm pack "poststruct@$BLOCK_VERSION" --pack-destination "$RUNNER_TEMP" > /dev/null 2>&1; then break; fi
            if [ "$i" = "60" ]; then echo "the registry never served poststruct@$BLOCK_VERSION (60 attempts)"; exit 1; fi
            echo "waiting for poststruct@$BLOCK_VERSION on the registry (attempt $i/60)"; sleep 5
          done
          gh release upload "$BLOCK_TAG" "$RUNNER_TEMP/poststruct-$BLOCK_VERSION.tgz" --clobber

  # The verify leg judges what the registry and GitHub actually serve, so it
  # must wait for release to cut the object and attach the tarball - a bare
  # `needs: publish` let verify race release and red-flag a cut that landed
  # (the packstruct 1.1.0 first run). It ALSO stands alone in verify-only mode
  # (publish skipped, release skipped, the ladder judged against what is
  # already served and released).
  verify:
    needs: [publish, release]
    if: >-
      always() &&
      (needs.publish.result == 'success' ||
       (needs.publish.result == 'skipped' && inputs.mode == 'verify-only'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - name: the post-publish trust ladder (npm + GH release)
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -e
          V="$(node -p "require('./package.json').version")"
          EXPECTED_EXPORTS="$(node -p "Object.keys(require('./package.json').exports).join(',')")"
          PS_PROBE="const p=require('poststruct');if(typeof p.runAudit!=='function')process.exit(1);if(p.SCHEMA_VERSION!==1)process.exit(1)"
          node scripts/verify-release.cjs --npm --version "$V" --exports "$EXPECTED_EXPORTS" --probe "$PS_PROBE" --allow packs/
          node scripts/verify-release.cjs --gh --tag "v$V" --asset "poststruct-$V.tgz"
