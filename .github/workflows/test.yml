name: test
on:
  push: { branches: [main, staging] }
  pull_request: { branches: [main, staging] }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 20 }
      # Hermetic: the shipped lockfile resolves the full family-tool trio at
      # EXACT pins (eyestruct 1.0.0, packstruct 1.0.0, crashtest 1.1.0) -
      # same commit, same findings, the discipline the eyestruct battery
      # carries (gistory#14; eyestruct test.yml 91928a7 / cd135a9).
      - run: npm ci --no-fund --no-audit
      # The negative test spine: the good fixture must be clean, the bad
      # fixture must produce EXACTLY the expected FAIL ids.
      - run: npm test
      # The battery composition: test spine + the pack lints (deep lint via
      # the lint-packs wrapper verb over the repo's own install + packstruct
      # audit-conformance through the campaign runner loader).
      - run: npm run check
